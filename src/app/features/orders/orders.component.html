<div class="list-header">
    <h1>Orders List</h1>
    <div class="summary-box">
        <div class="orders" *ngFor="let order of orders">
            <li> {{ order.name }} - {{ order.price | priceCurrency }}</li>
        </div>
        Total Value: {{ getTotal() | priceCurrency }}
    </div>
    
    <div class="header-actions">
        <button class="primary-btn" routerLink="/add-order">+ Add Order</button>
    </div>
</div>
